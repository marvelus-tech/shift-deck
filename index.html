<script>
/* =====================================================================
   1) CONFIG: client details and prices. Change these per client.
   ===================================================================== */
const CONFIG = {
  clientName:   "Your Fleet",
  contactName:  "[contact name]",
  contactEmail: "[contact email]",
  contactPhone: "[contact phone]",
  bookingLink:  "[booking link]",
  prototypeUrl: "https://shift-hub-MarvelUs.replit.app",

  // Prices. Shown on the pricing slide and wherever {name} appears in SLIDES.
  currency:       "AUD",
  introPrice:     "Free",
  introLength:    "30 mins",
  retainerPrice:  "$2,000",
  retainerStandard: "$2,500",   // shown struck through; set to "" to hide
  monthlyBase:    "$150",
  monthlyStandard: "$200",      // shown struck through; set to "" to hide
  dealLabel:      "Launch pricing", // small tag beside discounted prices; "" to hide
  monthlyUnit:    "/month",
  monthlyNote:    "Base, no active cars",
  fleetTiers: [
    // ["cars", "price", "optional small note"]
    ["1 to 5 cars",    "Included"],
    ["6 to 10 cars",   "+$25/month"],
    ["11 to 30 cars",  "+$50/month"],
    ["31 to 60 cars",  "+$100/month"],
    ["61 to 100 cars", "+$200/month"]
  ]
};

/* =====================================================================
   2) SLIDES: all slide text, in order. Edit the words here.
      *word*  shows in the accent blue.   {clientName}, {retainerPrice} etc.
      pull values from CONFIG.   "type" picks the layout; leave it as is.
      Delete a whole { ... } block to drop a slide, copy one to add it.
   ===================================================================== */
const SLIDES = [
  { type: "cover",
    prepared: "Prepared for {clientName}",
    tagline: "From spreadsheets and Marketplace to one platform." },

  /* ---------- PROBLEM ---------- */
  { type: "today", chapter: "Problem", sub: "Where you are today",
    title: "Three things *slow you down.*",
    columns: [
      { n: "01", name: "Managing",
        lines: ["Cars, contracts and people live in Excel or Word.",
                "Forget to enter something and it is gone.",
                "Maintenance and after hours bookings slip."] },
      { n: "02", name: "Onboarding",
        lines: ["Competitors like Rent AAA take 20 to 30 minutes to onboard.",
                "Long, intimidating sign up scares renters away.",
                "Paperwork still has to happen on every hire."] },
      { n: "03", name: "Juggling channels",
        lines: ["Every hire runs across Marketplace, email, phone and messages.",
                "Dates, car, payment, ID and pickup, all by message.",
                "Back and forth at every step of the hire."] }
    ] },

  /* ---------- SOLUTION ---------- */
  { type: "parts", chapter: "Solution",
    title: "One platform, *three parts.*",
    parts: [
      { name: "Owner operations system",  text: "Where you run vehicles, renters, bookings and contracts.", core: "Core" },
      { name: "Storefront",               text: "Your own website: public inventory and lead capture." },
      { name: "Renter management",        text: "Renters manage their own profile and contracts." }
    ],
    button: "View live prototype",
    caption: "Storefront, live prototype" },

  /* ---------- HOW IT WORKS ---------- */
  { type: "diagram", chapter: "How it works", sub: "Owner operations system",
    title: "Four modules, *one console.*",
    solvesLabel: "Solves",
    top:    { name: "Operational management", text: "The overview of everything below",
              solves: ["Juggling channels: statuses and notifications in one platform", "Stitching sheets together each morning"] },
    left:   { name: "Fleet management",       text: "Add and manage vehicle fleet.",
              solves: ["Allows owners to easily see and manage vehicle fleet.", "Missed maintenance", "Cars tracked in Excel"] },
    middle: { name: "Bookings and contracts", text: "Links a vehicle to a renter for each hire",
              solves: ["Simplified view for all contracts, upcoming and late payments.", "Double bookings and after hours errors", "Back and forth on every hire"] },
    right:  { name: "Renter management",      text: "Renters manage their own profile and contracts. See the contract and the car they have.",
              solves: ["Renters unsure of their contract or car", "Documents scattered across channels"] } },

  /* ---------- PRICING ---------- */
  { type: "pricing", chapter: "Pricing",
    title: "Start your SHIFT *owner account.*",
    lead: "Setup cost and monthly running costs.",
    plans: [
      { name: "Intro",              note: "{introLength}",  amount: "{introPrice}" },
      { name: "Discovery retainer", note: "Before Release 1", amount: "{retainerPrice}", was: "{retainerStandard}" },
      { name: "Monthly",            note: "{monthlyNote}",  amount: "{monthlyBase}", unit: "{monthlyUnit}", was: "{monthlyStandard}" }
    ],
    tiersLabel: "",
    tiersTitle: "Additional fees by fleet size",
    highlight: "Your monthly fee stays the same through all releases.",
    fine: "Prices in {currency}. Monthly payments start at Release 1." },

  { type: "steps", chapter: "How it works", sub: "Getting you running",
    title: "We set up the console *with you.*",
    steps: [
      { name: "Intro call",                   text: "We learn how your fleet runs.", tag: "{introPrice}, {introLength}" },
      { name: "Discovery",                    text: "We map your vehicles, renters and hires.", tag: "{retainerPrice} retainer", key: true },
      { name: "Adapt the platform",           text: "Shaped to your business." },
      { name: "Set up vehicles and renters",  text: "Your data moves in from Excel." },
      { name: "Go live",                      text: "Release 1 goes live.", tag: "Monthly payments begin", key: true },
      { name: "Ongoing support",              text: "We support and refine it as you use it." }
    ] },

  /* ---------- DELIVERY PATH ---------- */
  { type: "releases", chapter: "Delivery path",
    title: "One product, *growing in releases.*",
    releases: [
      { tag: "Release 1", name: "Core fleet management", text: "Moves you off Excel. Semi automated operations: vehicles, renters, bookings and contracts, operational overview." },
      { tag: "Release 2", name: "DocuSign and Stripe",   text: "Digital contracts and payments.", when: "~4 weeks", whenNote: "Design, dev and test" },
      { tag: "Release 3", name: "OCR document reading",  text: "Reads licences and documents.", when: "~4 weeks", whenNote: "Design, dev and test" },
      { tag: "Final",     name: "The full package",      text: "Everything working together, with smoother integration." }
    ],
    note: "Your monthly fee stays the same through all releases." },

  /* ---------- BENEFITS ---------- */
  { type: "benefits", chapter: "Benefits",
    title: "Every pain, *answered.*",
    headPain: "Today", headGain: "With SHIFT",
    rows: [
      ["Renting from Marketplace only",   "Your own website and inventory funnel"],
      ["Excel errors and missed entries", "One source of truth for vehicles, renters and bookings"],
      ["Missed maintenance",              "Maintenance tracked per vehicle"],
      ["After hours booking errors",      "Renters book and pay in the storefront any time"],
      ["Back and forth on every channel", "Contact cut down to the start and end of each hire"],
      ["Slow onboarding",                 "Renter profiles and digital contracts cut onboarding admin"]
    ] },

  /* ---------- NEXT STEP ---------- */
  { type: "next", chapter: "Next step",
    title: "Book your *discovery call.*",
    lead: "Start with a free 30 min intro. We look at how your fleet runs today and where SHIFT fits.",
    labels: { name: "Contact", email: "Email", phone: "Phone" },
    button: "Book the discovery call" }
];
</script>

<script>
/* Layout code. You should not need to edit below this line. */
(function(){
  const isPh = v => !v || /^\s*\[.*\]\s*$/.test(v);
  const fill = s => String(s == null ? '' : s).replace(/\{(\w+)\}/g, (m,k) => (typeof CONFIG[k] === 'string' ? CONFIG[k] : m));
  const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const t = s => esc(fill(s)).replace(/~(?:\/[^~]*)?~\s*/g,'').replace(/~(.+?)~/g,'<s class="was" aria-label="Standard price">$1</s>').replace(/\*(.+?)\*/g,'<span class="g">$1</span>');
  const hasWas = p => { const v = fill(p.was||'').trim(); return v !== '' && !/\{\w+\}/.test(v); };
  const arrowSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
  const head = s => `<p class="eyebrow"><b>${t(s.chapter||'')}</b>${s.sub?`<i>/</i>${t(s.sub)}`:''}</p><h2>${t(s.title||'')}</h2>${s.lead?`<p class="lead">${t(s.lead)}</p>`:''}`;
  const R = {
    cover: s => `<h1 class="mark"><span class="sl">/</span>SHIFT</h1><p class="for">${t(s.prepared).replace(esc(fill(CONFIG.clientName)),'<strong>$&</strong>')}</p><p class="tag">${t(s.tagline)}</p>`,
    twoProblems: s => `${head(s)}<div class="two">${s.cards.map(c=>`<div class="pc card"><p class="n">${t(c.n)}</p><h3>${t(c.name)}</h3><p>${t(c.text)}</p><div class="chips">${(c.chips||[]).map(x=>`<span class="chip">${t(x)}</span>`).join('')}</div></div>`).join('')}</div>`,
    today: s => `${head(s)}<div class="p3">${s.columns.map(c=>`<div class="col"><p class="n">${t(c.n)}</p><h3>${t(c.name)}</h3><ul>${c.lines.map(l=>`<li>${t(l)}</li>`).join('')}</ul></div>`).join('')}</div>`,
    points: s => `<div class="split"><div>${head(s)}</div><ul class="pts">${s.points.map(p=>`<li><h3>${t(p.title)}</h3><p>${t(p.text)}</p></li>`).join('')}</ul></div>`,
    compare: s => `<div class="split"><div>${head(s)}</div><div class="cmp">${[s.before,s.after].map((c,k)=>`<div class="c${k?' on':''}"><p class="lbl">${t(c.label)}</p><p class="big">${t(c.big)}</p><p>${t(c.text)}</p></div>`).join('')}</div></div>`,
    parts: s => `<div class="split"><div>${head(s)}<div class="parts">${s.parts.map(p=>`<div class="part">${p.tag?`<p class="lbl">${t(p.tag)}</p>`:''}<h3>${t(p.name)}${p.core?`<span class="core">${t(p.core)}</span>`:''}</h3><p>${t(p.text)}</p></div>`).join('')}</div><a class="btn tlink" data-href="prototypeUrl" target="_blank" rel="noopener">${t(s.button)} <span class="arr">&rarr;</span></a></div><div class="shots"><div class="browser"><div class="bar"><i></i><i></i><i></i></div><img src="assets/img/proto-desktop.jpg" alt="SHIFT storefront on desktop, live prototype"></div><div class="phone"><img src="assets/img/proto-mobile.jpg" alt="SHIFT storefront on a phone, live prototype"></div><p class="caption">${t(s.caption)}</p></div></div>`,
    pricing: s => `${head(s)}<div class="price-grid"><div class="plans">${s.plans.map((p,k)=>`<div class="plan card"><span class="num">${k+1}</span><div><h3>${t(p.name)}</h3><p>${t(p.note)}</p></div><div class="amt">${hasWas(p)&&CONFIG.dealLabel?`<span class="deal">${t(CONFIG.dealLabel)}</span>`:''}<span class="now">${hasWas(p)?`<s class="was" aria-label="Standard price">${t(p.was)}${p.unit?t(p.unit):''}</s>`:''}${t(p.amount)}${p.unit?`<small>${t(p.unit)}</small>`:''}</span></div></div>`).join('')}</div><div class="tiers card">${s.tiersLabel?`<p class="lbl">${t(s.tiersLabel)}</p>`:''}<h3>${t(s.tiersTitle)}</h3><table>${CONFIG.fleetTiers.map(r=>`<tr><td>${t(r[0])}${r[2]?`<small class="tnote">${t(r[2])}</small>`:''}</td><td>${t(r[1])}</td></tr>`).join('')}</table></div></div><p class="hl">${t(s.highlight)}</p><p class="fine">${t(s.fine)}</p>`,
    modules: s => `${head(s)}<div class="mods">${s.modules.map(m=>`<div class="mod card${m.top?' top':''}">${m.tag?`<p class="lbl">${t(m.tag)}</p>`:''}<h3>${t(m.name)}</h3><p>${t(m.text)}</p>${m.status?`<div class="status">${m.status.map((x,k)=>`<span class="st-${k}">${t(x)}</span>`).join('')}</div>`:''}${m.solves&&m.solves.length?`<div class="solves"><p class="lbl">${t(s.solvesLabel||'Solves')}</p><ul>${m.solves.map(x=>`<li>${t(x)}</li>`).join('')}</ul></div>`:''}</div>`).join('')}</div>`,
    diagram: s => { const b=(o,c)=>`<div class="box ${c}"><h3>${t(o.name)}</h3><p>${t(o.text)}</p>${o.solves&&o.solves.length?`<div class="solves"><p class="lbl">${t(s.solvesLabel||'Solves')}</p><ul>${o.solves.map(x=>`<li>${t(x)}</li>`).join('')}</ul></div>`:''}</div>`;
      return `${head(s)}<div class="dia">${b(s.top,'top')}<div class="bus"><span></span><span></span><span></span><span></span><span></span></div><div class="row">${b(s.left,'')}<div class="link"></div>${b(s.middle,'mid')}<div class="link"></div>${b(s.right,'')}</div></div>`; },
    steps: s => `${head(s)}<div class="proc">${s.steps.map((p,k)=>`<div class="pstep${p.key?' key':''}"><div class="dot">${k+1}</div><h3>${t(p.name)}</h3><p>${t(p.text)}</p>${p.tag?`<span class="price">${t(p.tag)}</span>`:''}</div>`).join('')}</div>`,
    releases: s => `${head(s)}<div class="tl"><div class="ms"><div class="track"></div>${s.releases.map(r=>`<div class="m"><div class="pin"></div><p class="lbl">${t(r.tag)}</p><h3>${t(r.name)}</h3><p>${t(r.text)}</p>${r.when?`<p class="when">${t(r.when)}${r.whenNote?`<span class="wn">${t(r.whenNote)}</span>`:''}</p>`:''}</div>`).join('')}</div></div><p class="hl tl-note">${t(s.note)}</p>`,
    benefits: s => `${head(s)}<div class="ben"><div class="r head"><p class="lbl">${t(s.headPain)}</p><span></span><p class="lbl">${t(s.headGain)}</p></div>${s.rows.map(r=>`<div class="r"><p class="pain">${t(r[0])}</p><span class="arrow">${arrowSvg}</span><p class="gain">${t(r[1])}</p></div>`).join('')}</div>`,
    next: s => `<div class="split"><div>${head(s)}</div><div class="contact card"><div class="row"><p class="lbl">${t(s.labels.name)}</p><p class="v">${t(CONFIG.contactName)}</p></div><div class="row"><p class="lbl">${t(s.labels.email)}</p><a class="v" data-mail>${t(CONFIG.contactEmail)}</a></div><div class="row"><p class="lbl">${t(s.labels.phone)}</p><a class="v" data-tel>${t(CONFIG.contactPhone)}</a></div><a class="btn" data-href="bookingLink" target="_blank" rel="noopener">${t(s.button)} <span class="arr">&rarr;</span></a></div></div>`
  };
  const frame = document.getElementById('frame');
  frame.innerHTML = SLIDES.map((s,k)=>`<section class="slide t-${s.type}${(s.type==='cover'||s.type==='next')?' dark':''}" aria-label="${esc(fill(s.chapter||'SHIFT'))}" data-type="${s.type}"><div class="inner">${(R[s.type]||(()=>''))(s)}</div></section>`).join('');
  frame.querySelectorAll('[data-href]').forEach(el=>{ const v=CONFIG[el.dataset.href]; if (isPh(v)) { el.href='#'; el.removeAttribute('target'); el.title='Add this link in CONFIG'; } else el.href=v; });
  frame.querySelectorAll('[data-mail]').forEach(el=>{ const v=CONFIG.contactEmail; el.href = isPh(v)?'#':'mailto:'+v.trim(); });
  frame.querySelectorAll('[data-tel]').forEach(el=>{ const v=CONFIG.contactPhone; el.href = isPh(v)?'#':'tel:'+v.replace(/[^\d+]/g,''); });

  const slides = Array.from(frame.querySelectorAll('.slide'));
  const N = slides.length, bar = document.querySelector('.progress i');
  const cur = document.getElementById('cur'), prev = document.getElementById('prev'), next = document.getElementById('next');
  document.getElementById('tot').textContent = N;
  let i = -1;
  function fromHash(){ const n = parseInt((location.hash||'').replace('#',''),10); return isNaN(n) ? 0 : Math.min(Math.max(n-1,0),N-1); }
  function go(n){
    n = Math.min(Math.max(n,0),N-1); if (n === i) return; i = n;
    slides.forEach((s,k)=>{ s.classList.toggle('active',k===n); s.classList.toggle('before',k<n); s.setAttribute('aria-hidden',k!==n); s.inert = k!==n; if(k===n) s.scrollTop = 0; });
    const ty = slides[n].dataset.type;
    document.body.classList.toggle('on-dark', slides[n].classList.contains('dark'));
    document.body.classList.toggle('bg-cover', ty==='cover'); document.body.classList.toggle('bg-next', ty==='next');
    bar.style.width = ((n+1)/N*100) + '%';
    cur.textContent = n+1; prev.disabled = n===0; next.disabled = n===N-1;
    if (location.hash !== '#'+(n+1)) history.replaceState(null,'','#'+(n+1));
  }
  const fwd = ()=>go(i+1), back = ()=>go(i-1);
  prev.addEventListener('click', e=>{e.stopPropagation(); back();});
  next.addEventListener('click', e=>{e.stopPropagation(); fwd();});
  document.addEventListener('keydown', e=>{
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const k = e.key;
    if (k==='ArrowRight'||k==='ArrowDown'||k==='PageDown'||(k===' '&&!e.shiftKey)){ e.preventDefault(); fwd(); }
    else if (k==='ArrowLeft'||k==='ArrowUp'||k==='PageUp'||(k===' '&&e.shiftKey)){ e.preventDefault(); back(); }
    else if (k==='Home'){ e.preventDefault(); go(0); }
    else if (k==='End'){ e.preventDefault(); go(N-1); }
  });
  let swiped = false;
  document.getElementById('deck').addEventListener('click', e=>{
    if (swiped) { swiped = false; return; }
    if (e.target.closest('a,button,input,select,textarea')) return;
    if (String(window.getSelection && window.getSelection()).length) return;
    (e.clientX < window.innerWidth/2) ? back() : fwd();
  });
  let sx=0, sy=0, st=0;
  window.addEventListener('touchstart', e=>{ const p=e.changedTouches[0]; sx=p.clientX; sy=p.clientY; st=Date.now(); }, {passive:true});
  window.addEventListener('touchend', e=>{
    const p=e.changedTouches[0], dx=p.clientX-sx, dy=p.clientY-sy;
    if (Math.abs(dx)>45 && Math.abs(dx)>Math.abs(dy)*1.3 && Date.now()-st<800){ swiped = true; setTimeout(()=>swiped=false,400); dx<0 ? fwd() : back(); }
  }, {passive:true});
  window.addEventListener('hashchange', ()=>go(fromHash()));
  go(fromHash());
})();
</script>
</body>
</html>
